<style>
:root{color-scheme:light dark;--bg:#F3F4F1;--card:#fff;--ink:#24282C;--muted:#63676B;--line:#DCDED9;--accent:#4C8A1E}
@media(prefers-color-scheme:dark){:root{--bg:#14171A;--card:#1D2226;--ink:#E9ECEA;--muted:#A0A5A8;--line:#2F363B;--accent:#8CCB4E}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
form{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:12px}
h1{font-size:20px;margin:0}p{margin:0;color:var(--muted);font-size:14px}
input[type=password]{font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit;width:100%}
button{font:inherit;font-weight:600;padding:12px;border:0;border-radius:8px;background:var(--accent);color:#fff;min-height:44px}
#err{color:#B02F2A;min-height:1.2em;font-size:14px}
</style></head><body>
<form id="f" autocomplete="on"><h1>Hotels Dashboard</h1><p>Enter the password to view.</p>
<input type="text" name="username" value="dashboard" autocomplete="username" hidden>
<input type="password" id="p" name="password" autocomplete="current-password" placeholder="Password" autofocus required>
<div id="err" role="alert"></div><button type="submit">Open</button></form>
